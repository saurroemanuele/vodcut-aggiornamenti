<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://jhoidpugjjvvkjccyrxg.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>NoonFrame · Collegamento account</title>
<link rel="icon" href="../favicon.png">
<style>
@font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(../fonts/inter-latin-wght-normal.woff2) format("woff2"); }
:root { --bg:#050A1C; --card:#0A1430; --line:#1B2A55; --fg:#F2F6FF; --fg2:#A6B4D4; --blue:#1E6BFF; --ok:#3DDC97; --err:#FF6B7A; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.55 Inter, system-ui, sans-serif; }
.card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; text-align: center; }
.logo { width: 48px; height: 48px; border-radius: 12px; }
h1 { font-size: 22px; margin: 16px 0 8px; }
p { color: var(--fg2); margin: 0 0 8px; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; background: var(--blue); animation: p 1s infinite alternate; }
.ok .dot { background: var(--ok); animation: none; } .err .dot { background: var(--err); animation: none; }
@keyframes p { to { opacity: .3; } }
a { color: #8CC2FF; }
</style>
<script src="callback.js" defer></script>
</head>
<body>
<main class="card" id="card">
<img class="logo" src="../logo.png" alt="NoonFrame">
<h1 id="t"><span class="dot"></span> Collegamento in corso…</h1>
<p id="m">Un attimo, stiamo collegando il tuo account a NoonFrame.</p>
</main>
</body>
</html>
