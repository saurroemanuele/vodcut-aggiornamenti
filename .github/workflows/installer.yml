# Ogni volta che una versione diventa stabile, rifà l'installer di Windows e il pacchetto Mac con quella versione
# e li pubblica come ultima release: chi scarica dal sito parte sempre dalla versione attuale.
# Python, ffmpeg e le librerie (che cambiano solo con un nuovo "runtime") si prendono dall'installer precedente.
# Il pacchetto Mac si rifà su un Mac (strumenti di Apple): icona di NoonFrame e firma rifatta dopo ogni modifica.
# Prima si rifaceva su Linux e la firma non corrispondeva più al contenuto: macOS diceva "NoonFrame è danneggiato".
name: Installer aggiornato

on:
  push:
    branches: [main]
    paths: ['stable/latest.json']
  workflow_dispatch:
    inputs:
      rifai:
        description: "Rifai l'installer della versione stabile anche se c'e' gia' (sostituisce i file della release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  versione:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      v: ${{ steps.v.outputs.v }}
      fai: ${{ steps.v.outputs.fai }}
      esiste: ${{ steps.v.outputs.esiste }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: stable
          sparse-checkout-cone-mode: true
      - id: v
        name: Versione stabile
        run: |
          V=$(jq -r .version stable/latest.json)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "installer-$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "esiste=1" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.rifai }}" = "true" ]; then echo "fai=1" >> "$GITHUB_OUTPUT"; else echo "installer-$V esiste gia'"; fi
          else
            echo "fai=1" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: versione
    if: needs.versione.outputs.fai == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            stable
            build
          sparse-checkout-cone-mode: true

      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis p7zip-full zip jq >/dev/null

      - name: App della versione (controllo dell'impronta firmata)
        run: |
          URL=$(jq -r .url stable/latest.json); SHA=$(jq -r .sha256 stable/latest.json)
          curl -fsSL "$URL" -o app.zip
          echo "$SHA  app.zip" | sha256sum -c -

      - name: Base dall'installer precedente
        run: |
          mkdir -p prev
          # i nomi dei file sono cambiati nel tempo (Noonframe / NoonFrame): si prende quello che c'e'
          gh release download -R "$GITHUB_REPOSITORY" -p '*-Setup.exe' -D prev
          mv prev/*-Setup.exe prev/setup.exe

      - name: Installer Windows
        run: |
          7z x prev/setup.exe -obase -y >/dev/null
          test -f base/python/python.exe && test -d base/ffmpeg
          mkdir -p w/installer w/offline
          mv base/python w/offline/python
          mv base/ffmpeg w/offline/ffmpeg
          unzip -q app.zip -d w/installer/app
          cp build/installer/* w/installer/
          sed -i "s/^!define VERSION .*/!define VERSION \"$V\"/" w/installer/vodcut.nsi
          (cd w/installer && makensis -V2 vodcut.nsi)
          7z e -so w/installer/Noonframe-Setup.exe app/engine/version.py | grep -q "VERSION = \"$V\""
          mkdir -p out && mv w/installer/Noonframe-Setup.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/Noonframe-Setup.exe
          retention-days: 3

  mac:
    needs: versione
    if: needs.versione.outputs.fai == '1'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            stable
            build
          sparse-checkout-cone-mode: true

      - name: App della versione (controllo dell'impronta firmata)
        run: |
          URL=$(jq -r .url stable/latest.json); SHA=$(jq -r .sha256 stable/latest.json)
          curl -fsSL "$URL" -o app.zip
          echo "$SHA  app.zip" | shasum -a 256 -c -

      - name: Base dal pacchetto precedente
        run: |
          mkdir -p prev
          gh release download -R "$GITHUB_REPOSITORY" -p '*-Mac.zip' -D prev
          mv prev/*-Mac.zip prev/mac.zip

      - name: Pacchetto Mac
        run: |
          set -e
          mkdir mac && ditto -x -k prev/mac.zip mac
          APP=$(ls -d mac/*.app | head -n 1)
          test -d "$APP/Contents/Resources/app"
          rm -rf "$APP/Contents/Resources/app"
          ditto -x -k app.zip "$APP/Contents/Resources/app"
          # icona di NoonFrame (il pacchetto di partenza aveva ancora quella dei primi tempi)
          IS="$RUNNER_TEMP/NoonFrame.iconset"; rm -rf "$IS"; mkdir -p "$IS"
          for s in 16 32 128 256 512; do
            sips -z $s $s build/mac/NoonFrame.png --out "$IS/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) build/mac/NoonFrame.png --out "$IS/icon_${s}x${s}@2x.png" >/dev/null
          done
          rm -f "$APP"/Contents/Resources/*.icns
          iconutil -c icns "$IS" -o "$APP/Contents/Resources/NoonFrame.icns"
          P="$APP/Contents/Info.plist"
          for k in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :$k $V" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$k string $V" "$P"
          done
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile NoonFrame" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string NoonFrame" "$P"
          # firma rifatta dopo le modifiche: se non e' valida ci si ferma qui e non si pubblica niente
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          grep -q "VERSION = \"$V\"" "$APP/Contents/Resources/app/engine/version.py"
          mkdir -p out && ditto -c -k --keepParent "$APP" out/NoonFrame-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/NoonFrame-Mac.zip
          retention-days: 3

  pubblica:
    needs: [versione, windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Pubblica come ultima release
        run: |
          ls -la out
          # stessi nomi dei link del sito: releases/latest/download/Noonframe-Setup.exe e NoonFrame-Mac.zip
          if [ "${{ needs.versione.outputs.esiste }}" = "1" ]; then
            gh release upload "installer-$V" out/Noonframe-Setup.exe out/NoonFrame-Mac.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "installer-$V" out/Noonframe-Setup.exe out/NoonFrame-Mac.zip -R "$GITHUB_REPOSITORY" \
              --title "NoonFrame $V" --notes "Installer di NoonFrame $V per Windows e Mac." --latest
          fi
