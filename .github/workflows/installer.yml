# Ogni volta che una versione diventa stabile, rifà l'installer di Windows e il pacchetto Mac con quella versione
# e li pubblica come ultima release: chi scarica dal sito parte sempre dalla versione attuale.
# Python, ffmpeg e le librerie (che cambiano solo con un nuovo "runtime") si prendono dall'installer precedente.
# Il pacchetto Mac si rifà su un Mac (strumenti di Apple): icona di NoonFrame e firma rifatta dopo ogni modifica.
# Prima si rifaceva su Linux e la firma non corrispondeva più al contenuto: macOS diceva "NoonFrame è danneggiato".
name: Installer aggiornato

on:
  push:
    branches: [main]
    paths: ['stable/latest.json']
  workflow_dispatch:
    inputs:
      rifai:
        description: "Rifai l'installer della versione stabile anche se c'e' gia' (sostituisce i file della release)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  versione:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      v: ${{ steps.v.outputs.v }}
      fai: ${{ steps.v.outputs.fai }}
      esiste: ${{ steps.v.outputs.esiste }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: stable
          sparse-checkout-cone-mode: true
      - id: v
        name: Versione stabile
        run: |
          V=$(jq -r .version stable/latest.json)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "installer-$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "esiste=1" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.rifai }}" = "true" ]; then echo "fai=1" >> "$GITHUB_OUTPUT"; else echo "installer-$V esiste gia'"; fi
          else
            echo "fai=1" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: versione
    if: needs.versione.outputs.fai == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            stable
            build
          sparse-checkout-cone-mode: true

      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis p7zip-full zip jq >/dev/null

      - name: App della versione (controllo dell'impronta firmata)
        run: |
          URL=$(jq -r .url stable/latest.json); SHA=$(jq -r .sha256 stable/latest.json)
          curl -fsSL "$URL" -o app.zip
          echo "$SHA  app.zip" | sha256sum -c -

      - name: Base dall'installer precedente
        run: |
          mkdir -p prev
          # i nomi dei file sono cambiati nel tempo (Noonframe / NoonFrame): si prende quello che c'e'
          gh release download -R "$GITHUB_REPOSITORY" -p '*-Setup.exe' -D prev
          mv prev/*-Setup.exe prev/setup.exe

      - name: Installer Windows
        run: |
          7z x prev/setup.exe -obase -y >/dev/null
          test -f base/python/python.exe && test -d base/ffmpeg
          mkdir -p w/installer w/offline
          mv base/python w/offline/python
          mv base/ffmpeg w/offline/ffmpeg
          unzip -q app.zip -d w/installer/app
          cp build/installer/* w/installer/
          sed -i "s/^!define VERSION .*/!define VERSION \"$V\"/" w/installer/vodcut.nsi
          (cd w/installer && makensis -V2 vodcut.nsi)
          7z e -so w/installer/Noonframe-Setup.exe app/engine/version.py | grep -q "VERSION = \"$V\""
          mkdir -p out && mv w/installer/Noonframe-Setup.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/Noonframe-Setup.exe
          retention-days: 3

  mac:
    needs: versione
    if: needs.versione.outputs.fai == '1'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            stable
            build
          sparse-checkout-cone-mode: true

      - name: App della versione (controllo dell'impronta firmata)
        run: |
          URL=$(jq -r .url stable/latest.json); SHA=$(jq -r .sha256 stable/latest.json)
          curl -fsSL "$URL" -o app.zip
          echo "$SHA  app.zip" | shasum -a 256 -c -

      - name: Base dal pacchetto precedente
        run: |
          mkdir -p prev
          gh release download -R "$GITHUB_REPOSITORY" -p '*-Mac.zip' -D prev
          mv prev/*-Mac.zip prev/mac.zip

      - name: Pacchetto Mac
        run: |
          set -e
          mkdir mac && ditto -x -k prev/mac.zip mac
          APP=$(ls -d mac/*.app | head -n 1)
          test -d "$APP/Contents/Resources/app"
          rm -rf "$APP/Contents/Resources/app"
          ditto -x -k app.zip "$APP/Contents/Resources/app"
          # icona di NoonFrame (il pacchetto di partenza aveva ancora quella dei primi tempi)
          IS="$RUNNER_TEMP/NoonFrame.iconset"; rm -rf "$IS"; mkdir -p "$IS"
          for s in 16 32 128 256 512; do
            sips -z $s $s build/mac/NoonFrame.png --out "$IS/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) build/mac/NoonFrame.png --out "$IS/icon_${s}x${s}@2x.png" >/dev/null
          done
          rm -f "$APP"/Contents/Resources/*.icns
          iconutil -c icns "$IS" -o "$APP/Contents/Resources/NoonFrame.icns"
          P="$APP/Contents/Info.plist"
          for k in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :$k $V" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$k string $V" "$P"
          done
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile NoonFrame" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string NoonFrame" "$P"
          grep -q "VERSION = \"$V\"" "$APP/Contents/Resources/app/engine/version.py"
          xattr -cr "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Firma con il certificato Apple di NoonFrame (Developer ID) e verifica di Apple (notarizzazione): il Mac apre
      # NoonFrame senza avvisi. Senza i Secrets (MAC_CERT_P12, MAC_CERT_PASSWORD, NOTARY_KEY_P8) firma "ad hoc" come prima.
      # Le chiavi stanno solo nei Secrets del repo: qui si usano in un portachiavi temporaneo che sparisce con la macchina.
      - name: Firma
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: GP3DFV5D2X
          NOTARY_ISSUER: "881e1d23-f2c4-49cd-9115-2998cb9d4ee2"
          SIGN_ID: "Developer ID Application: Emanuele Saurro (7NXQ42D487)"
        run: |
          set -e
          if [ -z "$MAC_CERT_P12" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "Secrets della firma Apple assenti: firma ad hoc (al primo avvio il Mac chiede conferma)"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            exit 0
          fi
          KC="$RUNNER_TEMP/firma.keychain-db"; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/firma.p12"
          security import "$RUNNER_TEMP/firma.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/firma.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Python, le sue librerie e ffmpeg: con l'hardened runtime servono questi permessi (codice generato al volo,
          # librerie caricate dal pacchetto)
          ENT="$RUNNER_TEMP/noonframe.entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.cs.allow-jit bool true" \
            -c "Add :com.apple.security.cs.allow-unsigned-executable-memory bool true" \
            -c "Add :com.apple.security.cs.disable-library-validation bool true" "$ENT" >/dev/null
          # ogni eseguibile e libreria dentro il pacchetto (dal piu' interno), poi il pacchetto intero
          n=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime --entitlements "$ENT" --sign "$SIGN_ID" "$f"
              n=$((n+1))
            fi
          done < <(find "$APP/Contents" -type f ! -name "*.py" ! -name "*.pyc" ! -name "*.js" ! -name "*.json" ! -name "*.png" -print0)
          echo "firmati $n eseguibili e librerie"
          codesign --force --timestamp --options runtime --entitlements "$ENT" --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # verifica di Apple: se Apple non accetta, si ferma qui e non si pubblica niente (il motivo nel log)
          if [ -n "$NOTARY_KEY_P8" ] && [ -n "$NOTARY_ISSUER" ]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notar.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notar.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER" --wait --timeout 90m --output-format json > "$RUNNER_TEMP/notar.json" || true
            ST=$(jq -r .status "$RUNNER_TEMP/notar.json"); SID=$(jq -r .id "$RUNNER_TEMP/notar.json")
            echo "verifica di Apple: $ST"
            if [ "$ST" != "Accepted" ]; then
              xcrun notarytool log "$SID" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
              rm -f "$RUNNER_TEMP/notary.p8"; exit 1
            fi
            rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notar.zip"
            xcrun stapler staple "$APP"
            spctl -a -vvv -t exec "$APP"
          else
            echo "manca la chiave per la verifica di Apple: firmato ma non verificato"
          fi
          security delete-keychain "$KC"

      - name: Zip del pacchetto Mac
        run: mkdir -p out && ditto -c -k --keepParent "$APP" out/NoonFrame-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/NoonFrame-Mac.zip
          retention-days: 3

  pubblica:
    needs: [versione, windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Pubblica come ultima release
        run: |
          ls -la out
          # stessi nomi dei link del sito: releases/latest/download/Noonframe-Setup.exe e NoonFrame-Mac.zip
          if [ "${{ needs.versione.outputs.esiste }}" = "1" ]; then
            gh release upload "installer-$V" out/Noonframe-Setup.exe out/NoonFrame-Mac.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "installer-$V" out/Noonframe-Setup.exe out/NoonFrame-Mac.zip -R "$GITHUB_REPOSITORY" \
              --title "NoonFrame $V" --notes "Installer di NoonFrame $V per Windows e Mac." --latest
          fi
